<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":985}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Fuera del prototipo, la app guarda que ya se vio y no la vuelve a mostrar (solo el primer inicio).
    this.state = { show: true };
    this.replay = () => {
      clearTimeout(this._t);
      this.setState({ show: false });
      this._t = setTimeout(() => this.setState({ show: true }), 40);
    };
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() { return { show: this.state.show, replay: this.replay }; }
}
</script>
