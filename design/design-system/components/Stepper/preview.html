<!-- @dsCard group="Datos" height=300 subtitle="Hecho · actual · pendiente · detenido" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Roboto:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:var(--surface)} .demo{padding:24px;display:flex;flex-direction:column;gap:16px} .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px} .cap{font:500 11px/16px var(--font-sans);letter-spacing:.5px;color:var(--on-surface-variant);text-transform:uppercase}</style>
</head>
<body class="pp-root">
<div class="demo"><ol class="pp-steps" aria-label="Pasos de la solicitud">
  <li class="pp-step pp-step--done" aria-label="Paso 1 de 3, Solicitud enviada, completado"><div class="pp-step__row"><span class="pp-step__dot" aria-hidden="true"><span class="pp-icon pp-icon--20" aria-hidden="true">check</span></span><span class="pp-step__label" aria-hidden="true">Solicitud enviada <span class="pp-step__note">(completado)</span></span></div></li>
  <li class="pp-step pp-step--current" aria-current="step" aria-label="Paso 2 de 3, Esperando respuesta, paso actual"><div class="pp-step__row"><span class="pp-step__dot" aria-hidden="true">2</span><span class="pp-step__label" aria-hidden="true">Esperando respuesta</span></div></li>
  <li class="pp-step" aria-label="Paso 3 de 3, Adopción finalizada, pendiente"><div class="pp-step__row"><span class="pp-step__dot" aria-hidden="true">3</span><span class="pp-step__label" aria-hidden="true">Adopción finalizada</span></div></li>
</ol>
<ol class="pp-steps" aria-label="Pasos de la solicitud cancelada">
  <li class="pp-step pp-step--done"><div class="pp-step__row"><span class="pp-step__dot" aria-hidden="true"><span class="pp-icon pp-icon--20" aria-hidden="true">check</span></span><span class="pp-step__label">Solicitud enviada</span></div></li>
  <li class="pp-step pp-step--stopped" aria-current="step"><div class="pp-step__row"><span class="pp-step__dot" aria-hidden="true"><span class="pp-icon pp-icon--20" aria-hidden="true">close</span></span><span class="pp-step__label">Solicitud cancelada</span></div></li>
</ol></div>
<script>(function(){if(document.querySelector('link[data-pp-fonts]'))return;var l=document.createElement('link');l.rel='stylesheet';l.setAttribute('data-pp-fonts','');l.href='https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Roboto:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block';(document.head||document.documentElement).appendChild(l);})();</script>
</body>
</html>
