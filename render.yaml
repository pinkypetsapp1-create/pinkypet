# Blueprint de Render para el backend de Pinky Pet (plan gratuito). Ver docs/DEPLOY.md.
# Los valores secretos NO están aquí: «sync: false» = se pegan en el panel de Render; «generateValue» = los crea Render.
services:
  - type: web
    name: pinky-pet-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "26"
      - key: MONGODB_URI
        sync: false
      # Decisión F3-1: los secretos JWT los genera Render; nadie los ve ni los copia.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pinky-pet-app.onrender.com,https://localhost,capacitor://localhost,http://localhost:8100
      - key: SEED_DEMO_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_URL
        value: https://pinky-pet-app.onrender.com

  # La app como web (para probarla online desde cualquier navegador). Usa el backend de arriba (environment.prod.ts).
  - type: web
    name: pinky-pet-app
    runtime: static
    rootDir: app
    buildCommand: npm ci && npx ng build
    staticPublishPath: www
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "26"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      # Aplicación de una sola página: cualquier ruta (/mascotas, /test…) la resuelve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
